  const d = document.createElement("div");
  d.style.cssText = "position:fixed;bottom:0;left:0;right:0;min-height:80px;background:#fff;z-index:9999;padding:10px";
  d.innerHTML = BANNERS[new URLSearchParams(location.search).get("lang")];
  document.body.appendChild(d);
  d.querySelector("[data-track=accept]").onclick = () => d.remove();

</body></html>
