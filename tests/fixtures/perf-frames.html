<!doctype html><html><head><meta charset="utf-8"><title>Perf with frames</title></head><body>
<p>Page with 40 about:blank ad/tracking frames and a live ticker.</p>
<div id="ticker"></div>
<footer><a href="/cookies">Cookie settings</a></footer>
<script>
  for (let i = 0; i < 40; i++) {
    const f = document.createElement("iframe");
    f.style.cssText = i % 4 ? "width:1px;height:1px;border:0" : "width:300px;height:250px;border:0";
    document.body.appendChild(f);
    f.contentDocument.body.innerHTML = "<div>Ad slot " + i + "</div>";
    setInterval(() => { f.contentDocument.body.firstChild.textContent = "Ad " + Date.now(); }, 200);
  }
  const ticker = document.getElementById("ticker");
  setInterval(() => { const s = document.createElement("span"); s.textContent = Date.now(); ticker.replaceChildren(s); }, 100);
  window.__lag = { max: 0, total: 0 };
  let last = performance.now();
  setInterval(() => {
    const now = performance.now(), over = now - last - 10;
    if (over > 0) { window.__lag.total += over; window.__lag.max = Math.max(window.__lag.max, over); }
    last = now;
  }, 10);
</script>
</body></html>
