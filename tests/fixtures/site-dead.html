<!doctype html><html><head><meta charset="utf-8"><title>Site with broken CMP iframe</title></head><body>
<script src="/harness.js"></script>
<p>Publisher page whose CMP iframe never closes (its parent script is broken).</p>
<div id="sp_wrapper" style="position:fixed;bottom:0;left:0;right:0;height:140px;z-index:9999">
  <iframe id="cmp" style="width:100%;height:100%;border:0;background:#fff"></iframe>
</div>
<iframe id="embed" style="width:300px;height:100px;border:0"></iframe>
<script>
  const src = "http://localhost:" + location.port + "/cmp-frame.html";
  document.getElementById("cmp").src = src;
  document.getElementById("embed").src = src + "?embed"; // in-content embed: must stay
</script>
</body></html>
