<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>I Don't Give a Cookie</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        padding: 10px;
        min-width: 220px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px 0;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      small {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <h1>I Don't Give a Cookie</h1>
    <label>
      <input type="checkbox" id="enabled" />
      Auto-accept cookie popups
    </label>
    <small>
      If a site misbehaves, disable this and reload the page.
    </small>

    <script src="popup.js"></script>
  </body>
</html>
