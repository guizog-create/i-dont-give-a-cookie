name: Real-site crawl

# Nightly report on how the extension does on real websites. It is a REPORT,
# not a test: the live web changes every day, so the scheduled run never
# fails (and so never sends failure emails). Findings appear as annotations
# on the run and in its job summary; screenshots are in the crawl-report
# artifact.
#
# GitHub-hosted runners are in the US, where many sites show no consent
# banner at all. For coverage numbers run `npm run crawl` from an EU network.
#
# To use the crawl as a gate (e.g. before a release), start it manually with
# "fail on suspicious" ticked: it then fails on any suspicious action not
# listed in tests/crawl-reviewed.json.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max number of sites (empty = all)"
        required: false
      fail_on_suspicious:
        description: "Fail the run on a new suspicious action"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Crawl
        env:
          LIMIT: ${{ github.event.inputs.limit }}
          FAIL: ${{ github.event.inputs.fail_on_suspicious == 'true' && '--fail-on-suspicious' || '' }}
        run: npm run crawl -- --annotate $FAIL ${LIMIT:+--limit "$LIMIT"}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: crawl-report
          path: crawl-report/
          retention-days: 14
