name: Real-site crawl

# Nightly check against real websites. GitHub-hosted runners are in the US,
# where many sites don't show consent banners at all, so treat these results
# as a smoke test (mostly: "suspicious" = we clicked something we shouldn't
# have). For coverage numbers run `npm run crawl` from an EU network.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max number of sites (empty = all)"
        required: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Crawl
        env:
          LIMIT: ${{ github.event.inputs.limit }}
        run: npm run crawl -- --fail-on-suspicious ${LIMIT:+--limit "$LIMIT"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crawl-report
          path: crawl-report/
          retention-days: 14
