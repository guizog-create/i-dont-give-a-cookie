name: Release

# Builds the Chrome Web Store zip and attaches it to a GitHub release named
# after manifest.json's version (e.g. v2.7.0). Two ways to start it:
#   - Actions → Release → "Run workflow" on main: creates the tag itself.
#   - Push a version tag (`git tag v2.7.0 && git push origin v2.7.0`); the tag
#     must match manifest.json's version.
# The full test suite and a smoke test of the packed zip must pass first, so
# the uploaded file is the tested one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Work out the tag
        run: |
          tag="v$(node -p "require('./manifest.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $tag"
              exit 1
            fi
          else
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run this workflow on main, not $GITHUB_REF_NAME"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag already exists. Bump version in manifest.json and package.json first."
              exit 1
            fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run pack
      - name: Smoke-test the packed zip
        run: |
          mkdir -p dist/ext && unzip -q dist/*.zip -d dist/ext
          for t in "popup" "site rules" "CMP API" "onetrust"; do
            IDGAC_EXT_DIR=dist/ext node tests/e2e.js "$t"
          done
      - name: Create the GitHub release with the store zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            gh release create "$TAG" dist/*.zip --title "$TAG" --generate-notes --verify-tag
          else
            # Creates the tag on the tested commit. A tag made with the
            # workflow token does not start this workflow again.
            gh release create "$TAG" dist/*.zip --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
